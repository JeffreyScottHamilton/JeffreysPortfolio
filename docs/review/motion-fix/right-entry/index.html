<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Right-side entry and portrait color</title><style>body{margin:0;background:#080909;color:#eee;font:16px system-ui;padding:26px}main{max-width:1280px;margin:auto}h1{font-size:26px}p{color:#b5b5ad;line-height:1.5}nav{display:flex;gap:12px;margin:20px 0}button{font:inherit;padding:12px;background:#222;color:#eee;border:1px solid #888;border-radius:4px}button[aria-pressed=true]{background:#eee;color:#111}video{width:100%;max-height:80vh;background:#111}a{color:#ddd}</style><main><h1>Right-side entry and portrait color</h1><p>The same particles gain the original portrait's color under the cursor while retaining fluid motion. Work previews arrive from the right as the line gathers into their outlines. These recordings show the local production build.</p><nav><button data-clip="cursor">Cursor color + motion</button><button data-clip="scroll">Right entry + line morph</button></nav><video controls playsinline preload="metadata"></video><p><a download id="download">Download MP4</a></p></main><script>const v=document.querySelector('video');function show(id){v.src=id+'.mp4';document.querySelector('#download').href=v.src;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.clip===id)))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.clip));show('cursor');</script></html>
