<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeffrey Hamilton · Motion review</title><style>body{margin:0;padding:30px;background:#080909;color:#eee;font:16px system-ui}main{max-width:1280px;margin:auto}h1{font-size:28px}p{color:#aaa;line-height:1.5}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{background:#222;color:#eee;border:1px solid #666;border-radius:5px;padding:10px;font:inherit}button[aria-pressed=true]{background:#eee;color:#111}video{display:block;width:100%;max-height:80vh;background:#111}a{color:#eee}</style><main><h1>Jeffrey Hamilton · Motion review</h1><p>Real Chromium recordings. Select a scene and compare before/after. The full photo loop holds each image for six seconds and includes last → first; it is not accelerated. Phone uses touch emulation.</p><select id="phase" aria-label="Review version"><option value="after">After correction</option><option value="before">Before correction</option></select><nav id="scenes"></nav><video controls playsinline preload="metadata" id="video"></video><p id="description"></p><p><a id="download" download>Download this MP4</a></p></main><script>const items=[['intro','Fresh intro'],['cursor','Cursor movement'],['scroll','Project scroll'],['mode','Work / Explore'],['photos','Two photo changes'],['return','Contact → opening'],['phone-intro','Phone intro'],['photos-wrap','Last two changes / wrap'],['photos-loop','Full photo loop']];let current='intro';const video=document.querySelector('video'),phase=document.querySelector('#phase');function show(){if(phase.value==='before'&&(current==='photos-loop'||current==='photos-wrap'))current='photos';const src=phase.value+'/'+current+'.mp4';video.src=src;document.querySelector('#download').href=src;document.querySelector('#description').textContent=phase.value+' · '+items.find(x=>x[0]===current)[1];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.clip===current)))}items.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.clip=id;b.onclick=()=>{current=id;show()};document.querySelector('nav').append(b)});phase.onchange=show;show();</script></html>
